# ==============================================================================
# Grafana – Dashboard Auto-Provisioning
#
# Deployed via 06-setup-mon-vm.sh → /etc/grafana/provisioning/dashboards/default.yml
# Statische Datei (kein Template).
#
# Grafana scannt das angegebene Verzeichnis und importiert alle JSON-Dashboards
# automatisch beim Start.
# ==============================================================================

apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
